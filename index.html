<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meri Website - Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 50px 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .welcome-msg {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.8;
        }

        .emoji {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 40px;
        }

        button {
            padding: 15px 30px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            width: 100%;
        }

        .login-btn {
            background-color: #667eea;
            color: white;
        }

        .login-btn:hover {
            background-color: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .next-btn {
            background-color: #764ba2;
            color: white;
        }

        .next-btn:hover {
            background-color: #653a88;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }

        .info-text {
            color: #999;
            font-size: 0.9rem;
            margin-top: 20px;
        }

        .status {
            margin-top: 15px;
            font-size: 0.95rem;
        }

        .logged-in {
            color: #27ae60;
            font-weight: bold;
        }

        .logged-out {
            color: #e74c3c;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .welcome-msg {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">👋</div>
        
        <h1>Khush Amdeed!</h1>
        
        <div class="welcome-msg">
            <p>Aap meri website par welcome hain!</p>
            <p>Neeche diye huey buttons use karke login karen ya agey barh sakte hain.</p>
        </div>

        <div class="status">
            <span id="loginStatus" class="logged-out">⚠️ Aap login nahi hain</span>
        </div>

        <div class="button-group">
            <button class="login-btn" onclick="goToLogin()">
                🔐 Login Karen
            </button>
            
            <button class="next-btn" onclick="checkLoginAndProceed()">
                ➡️ Agey Barhin
            </button>
        </div>

        <div class="info-text">
            <p>Login karne ke liye pehla button dabain</p>
        </div>
    </div>

    <script>
        // Page load par check karain ke user logged in hai ya nahi
        window.addEventListener('load', function() {
            checkLoginStatus();
        });

        // Login status check karne ke liye function
        function checkLoginStatus() {
            const userLoggedIn = localStorage.getItem('userLoggedIn');
            const statusElement = document.getElementById('loginStatus');
            
            if (userLoggedIn === 'true') {
                statusElement.textContent = '✅ Aap login hain';
                statusElement.className = 'logged-in';
            } else {
                statusElement.textContent = '⚠️ Aap login nahi hain';
                statusElement.className = 'logged-out';
            }
        }

        // Login page par ja ne ke liye
        function goToLogin() {
            window.location.href = 'login.html';
        }

        // Agey badhne se pehla check karain
        function checkLoginAndProceed() {
            const userLoggedIn = localStorage.getItem('userLoggedIn');
            
            if (userLoggedIn === 'true') {
                // Agar logged in hai to loggedsessionpage par bhejo
                window.location.href = 'loggedsessionpage.html';
            } else {
                // Agar logged in nahi hai to alert dikha
                alert('Pehle login karen! Login button press karen.');
            }
        }
    </script>
</body>
</html>
