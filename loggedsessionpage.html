<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Session - Meri Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        .profile-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 40px 30px;
            text-align: center;
            margin-bottom: 20px;
        }

        .profile-picture {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            border: 5px solid #667eea;
            object-fit: cover;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
        }

        .profile-picture.placeholder {
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        h2 {
            color: #333;
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .welcome-text {
            color: #666;
            font-size: 1rem;
            margin-bottom: 30px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            font-size: 1.05rem;
            width: 100%;
        }

        .btn-feed {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-feed:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-feed:active {
            transform: translateY(0);
        }

        .btn-logout {
            background-color: #e74c3c;
            color: white;
        }

        .btn-logout:hover {
            background-color: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(231, 76, 60, 0.4);
        }

        .btn-logout:active {
            transform: translateY(0);
        }

        .not-logged-in {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 50px 30px;
            text-align: center;
        }

        .not-logged-in h2 {
            color: #e74c3c;
            margin-bottom: 20px;
        }

        .not-logged-in p {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .btn-login {
            background-color: #667eea;
            color: white;
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.05rem;
            width: 100%;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background-color: #5568d3;
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            .profile-card {
                padding: 30px 20px;
            }

            h2 {
                font-size: 1.5rem;
            }

            .btn {
                padding: 12px 25px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Jab user logged in ho -->
        <div id="loggedInContent" style="display: none;">
            <div class="profile-card">
                <img id="profilePic" class="profile-picture" src="" alt="Profile Picture">
                <h2 id="userName">Loading...</h2>
                <p class="welcome-text">Khush Amdeed! 🎉</p>

                <div class="button-group">
                    <button class="btn btn-feed" onclick="goToFeed()">
                        📰 Go to Feed
                    </button>
                    <button class="btn btn-logout" onclick="logout()">
                        🚪 Logout Karen
                    </button>
                </div>
            </div>
        </div>

        <!-- Jab user logged in nahi ho -->
        <div id="notLoggedInContent" style="display: none;">
            <div class="not-logged-in">
                <h2>⚠️ Login Nahi Ho</h2>
                <p>Aap logged in nahi hain. Pehle login karen.</p>
                <button class="btn-login" onclick="goToLogin()">
                    🔐 Login Karen
                </button>
            </div>
        </div>
    </div>

    <script>
        // Page load par check karain
        window.addEventListener('load', function() {
            checkLoginStatus();
        });

        // Check karain ke user logged in hai ya nahi
        function checkLoginStatus() {
            const userLoggedIn = localStorage.getItem('userLoggedIn');
            const userData = localStorage.getItem('userData');

            if (userLoggedIn === 'true' && userData) {
                // User logged in hai - data dikhao
                displayUserData();
                document.getElementById('loggedInContent').style.display = 'block';
                document.getElementById('notLoggedInContent').style.display = 'none';
            } else {
                // User logged in nahi hai - login page dikha
                document.getElementById('loggedInContent').style.display = 'none';
                document.getElementById('notLoggedInContent').style.display = 'block';
            }
        }

        // User ka data dikhao
        function displayUserData() {
            const userDataStr = localStorage.getItem('userData');
            const userData = JSON.parse(userDataStr);

            // Profile picture set karo
            const profilePic = document.getElementById('profilePic');
            if (userData.profilePicture && userData.profilePicture !== '') {
                profilePic.src = userData.profilePicture;
                profilePic.onerror = function() {
                    this.src = 'https://via.placeholder.com/150?text=No+Image';
                };
            } else {
                profilePic.src = 'https://via.placeholder.com/150?text=No+Image';
            }

            // User ka naam
            document.getElementById('userName').textContent = userData.name || 'User';
        }

        // Feed page par jaao
        function goToFeed() {
            window.location.href = 'feed.html';
        }

        // Logout karo
        function logout() {
            const confirm_logout = confirm('Kya aap logout karna chahte hain?');
            
            if (confirm_logout) {
                // localStorage se data delete karo
                localStorage.removeItem('userLoggedIn');
                localStorage.removeItem('userData');
                localStorage.removeItem('accessToken');
                localStorage.removeItem('userID');

                // Home page par redirect karo
                window.location.href = 'index.html';
            }
        }

        // Login page par jaao
        function goToLogin() {
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
